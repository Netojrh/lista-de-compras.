<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista de Compras da Casa</title><style>body{font:16px system-ui,sans-serif;background:#f5f7f6;color:#20352d;margin:0}.wrap{max-width:720px;margin:auto;padding:18px}h1{margin-bottom:4px}p,.hint{color:#62736b}.panel{background:white;border-radius:16px;padding:18px;box-shadow:0 3px 16px #0001}label{display:block;font-weight:600;margin:10px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5cf;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:12px 15px;font:inherit;cursor:pointer}.primary{background:#16804b;color:white;width:100%;font-weight:700;margin-top:18px}.secondary{background:#e7f3eb;color:#12683d;margin-top:10px}.category{border:1px solid #dce6df;border-radius:12px;margin:14px 0;overflow:hidden}.category summary{padding:14px;font-weight:700;cursor:pointer;background:#edf6f0}.product{display:grid;grid-template-columns:26px minmax(0,1fr) 120px;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid #edf0ed}.product input[type=checkbox]{width:20px;height:20px;accent-color:#16804b}.product input[type=text]{padding:8px}.product label{margin:0;font-weight:400}.extra{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;margin:10px 0}.extra button{padding:8px;background:#fbe9e9;color:#a22}.hint{font-size:13px}#otherList{margin-top:10px}@media(max-width:420px){.product{grid-template-columns:24px 1fr 95px}.extra{grid-template-columns:1fr 90px 32px}.wrap{padding:10px}.panel{padding:12px}}</style></head><body><main class="wrap"><h1>🛒 Lista de Compras</h1><p>Marque os produtos em falta, informe as quantidades e envie pelo WhatsApp.</p><section class="panel"><label for="nome">Quem está solicitando?</label><input id="nome" placeholder="Nome da secretária"><div id="categorias"></div><h3>Outros produtos</h3><p class="hint">Inclua itens que não estão nas categorias.</p><div id="otherList"></div><button class="secondary" id="add">+ Adicionar outro produto</button><label for="obs">Observações gerais</label><textarea id="obs" rows="3" placeholder="Marcas preferidas, tamanhos, substituições..."></textarea><button class="primary" id="enviar">Enviar pelo WhatsApp</button><p class="hint">O WhatsApp abre com a lista pronta. Escolha o contato e confirme o envio.</p></section></main><script>
const catalogo={
'1. Itens da cesta básica':['Arroz','Feijão carioca','Feijão preto','Feijão verde','Açúcar','Café','Leite integral','Leite em pó','Óleo de soja','Azeite','Macarrão','Farinha de mandioca','Farinha de trigo','Flocão de milho','Goma de tapioca','Cuscuz','Sal','Ovos','Margarina','Manteiga','Pão de forma','Pão francês','Biscoito cream cracker','Molho de tomate','Extrato de tomate','Milho-verde','Ervilha','Sardinha em lata'],
'2. Frios':['Queijo coalho','Queijo manteiga','Queijo muçarela','Presunto','Requeijão','Iogurte'],
'3. Carnes':['Frango inteiro','Peito de frango','Coxa e sobrecoxa','Costela bovina','Costela suína','Carne de sol','Carne moída','Carne para bife','Carne para panela','Linguiça','Peixe'],
'4. Frutas e legumes':['Banana','Maçã','Mamão','Melancia','Melão','Abacaxi','Laranja','Limão','Manga','Uva','Abacate','Tomate','Cebola','Alho','Batata inglesa','Batata-doce','Cenoura','Beterraba','Chuchu','Abobrinha','Abóbora','Pepino','Pimentão','Alface','Couve','Coentro','Cebolinha','Macaxeira'],
'5. Bebidas':['Água mineral','Água com gás','Refrigerante','Suco de caixinha','Água de coco','Água tônica','Chá'],
'6. Polpas de frutas':['Polpa de acerola','Polpa de cajá','Polpa de caju','Polpa de goiaba','Polpa de graviola','Polpa de manga','Polpa de maracujá','Polpa de morango','Polpa de abacaxi','Polpa de umbu'],
'7. Material de limpeza':['Detergente','Sabão em pó','Sabão líquido','Sabão em barra','Amaciante','Água sanitária','Desinfetante','Álcool 70%','Limpador multiuso','Limpa-vidros','Esponja de louça','Palha de aço','Saco de lixo','Papel toalha','Pano de chão','Pano multiuso','Luva de limpeza','Vassoura','Rodo'],
'8. Supérfluos (chocolates e doces)':['Chocolate em barra','Bombom','Caixa de bombons','Biscoito recheado','Doce de leite','Goiabada','Paçoca','Pé de moleque','Balas','Chicletes','Sorvete','Leite condensado','Creme de leite','Gelatina','Pudim']};
const root=document.getElementById('categorias');for(const [categoria,produtos] of Object.entries(catalogo)){const details=document.createElement('details');details.className='category';const sum=document.createElement('summary');sum.textContent=categoria;details.append(sum);for(const nome of produtos){const row=document.createElement('div');row.className='product';const cb=document.createElement('input');cb.type='checkbox';const label=document.createElement('label');label.textContent=nome;label.onclick=()=>{cb.checked=!cb.checked};const qty=document.createElement('input');qty.type='text';qty.placeholder='Qtd./unid.';qty.setAttribute('aria-label','Quantidade de '+nome);qty.addEventListener('input',()=>{if(qty.value.trim())cb.checked=true});row.append(cb,label,qty);row.dataset.name=nome;row.dataset.category=categoria;details.append(row)}root.append(details)}
function addExtra(){const row=document.createElement('div');row.className='extra';row.innerHTML='<input class="extraName" placeholder="Nome do produto" aria-label="Outro produto"><input class="extraQty" placeholder="Quantidade" aria-label="Quantidade"><button type="button" aria-label="Remover">×</button>';row.querySelector('button').onclick=()=>row.remove();document.getElementById('otherList').append(row)}document.getElementById('add').onclick=addExtra;
document.getElementById('enviar').onclick=()=>{const grupos={};for(const row of document.querySelectorAll('.product')){if(!row.querySelector('[type=checkbox]').checked)continue;const cat=row.dataset.category;(grupos[cat]??=[]).push(row.dataset.name+' — '+(row.querySelector('[type=text]').value.trim()||'Quantidade a definir'))}const extras=[...document.querySelectorAll('.extra')].map(r=>({n:r.querySelector('.extraName').value.trim(),q:r.querySelector('.extraQty').value.trim()})).filter(x=>x.n);if(extras.length)grupos['Outros produtos']=extras.map(x=>x.n+' — '+(x.q||'Quantidade a definir'));if(!Object.keys(grupos).length){alert('Selecione pelo menos um produto.');return}const nome=document.getElementById('nome').value.trim()||'Não informado';const obs=document.getElementById('obs').value.trim();const msg='🛒 *LISTA DE COMPRAS*\nSolicitante: '+nome+'\nData: '+new Date().toLocaleDateString('pt-BR')+'\n\n'+Object.entries(grupos).map(([cat,linhas])=>'*'+cat+'*\n'+linhas.map(x=>'• '+x).join('\n')).join('\n\n')+(obs?'\n\n*Observações:* '+obs:'');window.location.href='https://api.whatsapp.com/send?phone=5584998731222&text='+encodeURIComponent(msg)};
</script></body></html>
